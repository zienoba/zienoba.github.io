<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>KSS 質問票</title>
  <link rel="stylesheet" href="style.css">
  <script src="storage.js" defer></script>
  <script src="script.js" defer></script>
  <script src="offline.js" defer></script>
</head>
<body class="questionnaire-page">
<main>
  <nav class="top-nav" aria-label="画面切り替え">
    <a href="admin.html" aria-label="管理者画面" title="管理者画面">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 1.72l-.12.87a2 2 0 0 1-1.18 1.52l-.27.12a2 2 0 0 1-1.9-.18l-.7-.54a2 2 0 0 0-2.72.54l-.22.38a2 2 0 0 0 .72 2.6l.7.44a2 2 0 0 1 .94 1.74v.32a2 2 0 0 1-.94 1.74l-.7.44a2 2 0 0 0-.72 2.6l.22.38a2 2 0 0 0 2.72.54l.7-.54a2 2 0 0 1 1.9-.18l.27.12a2 2 0 0 1 1.18 1.52l.12.87a2 2 0 0 0 2 1.72h.44a2 2 0 0 0 2-1.72l.12-.87a2 2 0 0 1 1.18-1.52l.27-.12a2 2 0 0 1 1.9.18l.7.54a2 2 0 0 0 2.72-.54l.22-.39a2 2 0 0 0-.72-2.6l-.7-.43a2 2 0 0 1-.94-1.74v-.32a2 2 0 0 1 .94-1.74l.7-.44a2 2 0 0 0 .72-2.6l-.22-.38a2 2 0 0 0-2.72-.54l-.7.54a2 2 0 0 1-1.9.18l-.27-.12a2 2 0 0 1-1.18-1.52l-.12-.87A2 2 0 0 0 12.22 2z"/>
        <circle cx="12" cy="11" r="3"/>
      </svg>
    </a>
  </nav>
  <h1>KSS 質問票</h1>
  <form class="card" id="questionnaire" novalidate>
    <div class="participant-field">
      <label for="sid">被験者ID</label>
      <input id="sid" name="sid" placeholder="例: 001" autocomplete="off" required>
    </div>
    <fieldset>
      <legend>「いま、この瞬間のあなたの眠気の状態」に最も近いものを、以下の1から9の中から1つだけ選んでください。</legend>
      <div class="grid" id="kssgrid"></div>
    </fieldset>
    <div class="save-panel">
      <label for="session">今の状況を選んでください</label>
      <select id="session" name="session" required>
        <option value="" disabled selected>選択してください</option>
        <option>夜間睡眠からの起床後</option>
        <option>昼寝からの起床後</option>
        <option>夕食後</option>
      </select>
      <button class="action" id="saveRecord" type="submit">保存</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </form>
  <noscript><p class="card">この質問票を使うにはJavaScriptを有効にしてください。</p></noscript>
</main>
</body>
</html>
