<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>KSS 管理者画面</title>
  <link rel="stylesheet" href="style.css">
  <script src="storage.js" defer></script>
  <script src="admin.js" defer></script>
  <script src="offline.js" defer></script>
</head>
<body>
<main>
  <h1>KSS 管理者画面</h1>
  <section class="card" aria-labelledby="historyTitle">
    <h2 id="historyTitle">記録一覧</h2>
    <p class="small">記録はこのブラウザに保存されています。別の端末・ブラウザとは共有されません。</p>
    <button class="export" id="exportCSV" type="button">CSV出力</button>
    <button class="clear" id="clearHistory" type="button">履歴を消去</button>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="table-scroll" tabindex="0" role="region" aria-label="保存済みの記録">
      <table>
        <thead><tr><th scope="col">ID</th><th scope="col">DateTime</th><th scope="col">Session</th><th scope="col">KSS</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="small" id="offlineNote">ダウンロードしたファイルからはオフラインでも利用できます。</p>
  </section>
  <nav aria-label="画面切り替え"><a href="index.html">質問票へ戻る</a></nav>
  <noscript><p class="card">この管理者画面を使うにはJavaScriptを有効にしてください。</p></noscript>
</main>
</body>
</html>
