<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>KSS 質問票</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>KSS 質問票</h1>
  <form class="card" id="questionnaire" novalidate>
    <label for="sid">被験者ID</label>
    <input id="sid" name="sid" placeholder="例: 001" autocomplete="off" required>
    <fieldset>
      <legend>「いま、この瞬間のあなたの眠気の状態」に最も近いものを、以下の1から9の中から1つだけ選んでください。</legend>
      <div class="grid" id="kssgrid"></div>
    </fieldset>
    <label for="session">今の状況を選んでください</label>
    <select id="session" name="session" required>
      <option value="" disabled selected>選択してください</option>
      <option>夜間睡眠からの起床後</option>
      <option>昼寝からの起床後</option>
      <option>夕食後</option>
    </select>
    <button class="action" id="saveRecord" type="submit">保存</button>
    <button class="export" id="exportCSV" type="button">CSV出力</button>
    <p class="small">日時は自動記録されます。記録はこのブラウザに保存されます。別の端末・ブラウザとは共有されません。</p>
    <p class="small" id="offlineNote">ダウンロードしたファイルからはオフラインでも利用できます。</p>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <section class="card" aria-labelledby="historyTitle">
    <h2 id="historyTitle">記録一覧</h2>
    <button type="button" class="clear" id="clearHistory">履歴を消去</button>
    <div class="table-scroll" tabindex="0" role="region" aria-label="保存済みの記録">
      <table>
        <thead><tr><th scope="col">ID</th><th scope="col">DateTime</th><th scope="col">Session</th><th scope="col">KSS</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
  <noscript><p class="card">この質問票を使うにはJavaScriptを有効にしてください。</p></noscript>
</main>
</body>
</html>
